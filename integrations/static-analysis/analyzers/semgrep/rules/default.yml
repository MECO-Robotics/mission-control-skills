# Core Semgrep starter rule set for Mission Control static analysis
# This profile intentionally uses built-in rule packs and safe defaults.
rules:
  - id: mc-no-eval
    pattern: eval($X)
    message: Avoid use of eval().
    severity: WARNING
    languages: [javascript, typescript, python]
    metadata:
      category: security
  - id: mc-print-credentials
    pattern: /password|secret|token/i
    message: Potential credential-like value mention.
    severity: INFO
    languages: [javascript, typescript, python]
    metadata:
      category: security
